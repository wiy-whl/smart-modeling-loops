# 智能建模评测量规

version: "1.0"
target: "智能建模主链路 Agent 编排"
source: "0720/0723 测试反馈 + OPT-001~012"

dimensions:
  - id: table_selection
    name: 选表准确性
    weight: 0.20
    threshold: 0.80
    levels:
      - score: 10
        description: "手动选表生效；推荐表与问题高度相关；多表可同时选中"
      - score: 6
        description: "推荐表部分相关；存在类型互斥或只能二选一"
      - score: 0
        description: "推荐表无关；手动选表报错；无法进入下游"

  - id: model_planning
    name: 建模规划完整性
    weight: 0.25
    threshold: 0.85
    levels:
      - score: 10
        description: "成功生成建模规划；tables/joins/filters 完整；status=success"
      - score: 6
        description: "规划不完整或需多次澄清"
      - score: 0
        description: "无建模规划；空 JSON；刷新无效"

  - id: operator_params
    name: 算子参数合规性
    weight: 0.25
    threshold: 0.85
    levels:
      - score: 10
        description: "一次或少量重试内生成符合算子结构的参数"
      - score: 6
        description: "部分节点参数需人工修正"
      - score: 0
        description: "多次重试仍无法生成合规参数"

  - id: json_protocol
    name: JSON 协议稳定性
    weight: 0.15
    threshold: 0.90
    levels:
      - score: 10
        description: "Schema 校验通过；字段完整；无语法错误"
      - score: 6
        description: "可 parse 但缺字段或类型不对"
      - score: 0
        description: "无法 parse；下游 silent fail"

  - id: ux_interaction
    name: 交互体验
    weight: 0.15
    threshold: 0.75
    levels:
      - score: 10
        description: "流式输出稳定；可上滑查看历史；会话可追溯"
      - score: 6
        description: "存在切页中断或会话缺失"
      - score: 0
        description: "对话框不可用；历史无法查看"

opt_mapping:
  - opt: OPT-001
    dimension: table_selection
    issue: "手动选表后仍推荐；多表只能二选一"
  - opt: OPT-002
    dimension: model_planning
    issue: "手动选表后无建模规划"
  - opt: OPT-003
    dimension: operator_params
    issue: "算子参数多次重试仍失败"
  - opt: OPT-004
    dimension: table_selection
    issue: "推荐表不准确"
  - opt: OPT-005
    dimension: table_selection
    issue: "手动添加表报错；@ 引用失败"
  - opt: OPT-006
    dimension: table_selection
    issue: "多表类型划分错误"
  - opt: OPT-010
    dimension: ux_interaction
    issue: "缺失会话历史"
  - opt: OPT-012
    dimension: ux_interaction
    issue: "流式输出中断；无法上滑"

thresholds:
  auto_pass: 8.0
  human_review: 6.0
  blocked: 6.0

aggregate_method: weighted_average
